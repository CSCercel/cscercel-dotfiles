format = """
$character\
$directory\
$git_branch\
$git_status"""

add_newline = false

[character]
success_symbol = "[➜](bold green) "
error_symbol = "[➜](bold red) "

[directory]
truncation_length = 1

[git_branch]
symbol = 'git'
format = '[$symbol:\([$branch](bold red)\)](bold blue) '

[git_status]
style = "bold yellow"
format = "[$all_status]($style) "
conflicted = "✗"
ahead = "✗"
behind = "✗"
diverged = "✗"
untracked = "✗"
stashed = "✗"
modified = "✗"
staged = "✗"
renamed = "✗"
deleted = "✗"
up_to_date = ""
